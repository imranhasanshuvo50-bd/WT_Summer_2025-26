<!DOCTYPE html>
<html>
<head>
    <title>Contact Form Validation</title>
</head>

<body>
    <center>
        <h2>Contact Form</h2>
    </center>

    <form onsubmit="return handleSubmut()">
        <label>Name:</label>
        <input type="text" id="name">
        <br><br>

        <label>Email:</label>
        <input type="text" id="email">
        <br><br>

        <label>Phone Number:</label>
        <input type="text" id="phone">
        <br><br>

        <label>Password:</label>
        <input type="password" id="password">
        <br><br>

        <label>Age:</label>
        <input type="text" id="age">
        <br><br>

        <label>Message:</label>
        <textarea id="message"></textarea>
        <br><br>

        <button type="submit">Submit</button>
    </form>

    <script>
        function handleSubmut()
        {
            var name = document.getElementById("name").value;
            var email = document.getElementById("email").value;
            var phone = document.getElementById("phone").value;
            var password = document.getElementById("password").value;
            var age = document.getElementById("age").value;
            var message = document.getElementById("message").value;

            if (name === "" || email === "" || phone === "" || password === "" || age === "" || message === "") {
                alert("Please fill the form");
                return false;
            }

            if (!/^[A-Za-z ]+$/.test(name) || name.length < 3) {
                alert("Name must use alphabets and minimum 3 characters");
                return false;
            }

            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                alert("Invalid email format");
                return false;
            }

            if (phone.length !== 10 || isNaN(phone)) {
                alert("Phone number must be exactly 10 digits");
                return false;
            }

            if (
                password.length < 8 ||
                !/[A-Z]/.test(password) ||
                !/[a-z]/.test(password) ||
                !/[0-9]/.test(password) ||
                !/[^A-Za-z0-9]/.test(password)
            ) {
                alert("Password needs uppercase, lowercase, number and special character");
                return false;
            }

            if (isNaN(age) || age < 18) {
                alert("Age must be 18 years or older");
                return false;
            }

            if (message.length < 10) {
                alert("Message must be minimum 10 characters");
                return false;
            }

            alert(
                "Registration Successful!\n" +
                "Name: " + name + "\n" +
                "Email: " + email + "\n" +
                "Phone: " + phone + "\n" +
                "Age: " + age + "\n" +
                "Message: " + message + "\n" +
                "Thank you for registering successfully."
            );

            return false;
        }
    </script>
</body>
</html>
