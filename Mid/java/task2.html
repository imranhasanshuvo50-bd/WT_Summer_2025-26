<!DOCTYPE html>
<html>
<head>
    <title>Portfolio Website</title>

    <style>
        body {
            font-family: Arial;
            background-color: white;
            color: black;
        }

        header {
            text-align: center;
            background-color: lightgray;
            padding: 20px;
        }

        nav {
            text-align: center;
            margin: 15px;
        }

        nav a {
            margin: 10px;
            color: blue;
        }

        section {
            border: 1px solid gray;
            margin: 15px;
            padding: 15px;
        }

        button {
            padding: 8px;
        }

    </style>
</head>

<body onload="showGreeting()">
    <header id="header">
        <h1>My Portfolio</h1>
        <h3 id="greeting"></h3>
        <button onclick="changeTheme()">Dark / Light Mode</button>
    </header>

    <nav>
        <a href="#about">About</a>
        <a href="#skills">Skills</a>
        <a href="#projects">Projects</a>
        <a href="#contact">Contact</a>
    </nav>

    <section id="about">
        <h2>About Me</h2>
        <p>My name is Md Imran Hasan shuvo</p>
    </section>

    <section id="skills">
        <h2>Skills</h2>
        <ul>
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
        </ul>
    </section>

    

    <section id="contact">
        <h2>Contact</h2>
        <p>Email: imranhasanshuvo5@gmail.com</p>
        <p>Phone: 0123456789</p>
    </section>

    <script>
        var darkMode = false;

        function changeTheme()
        {
            var header = document.getElementById("header");

            if (darkMode === false) {
                document.body.style.backgroundColor = "black";
                document.body.style.color = "white";
                header.style.backgroundColor = "#333333";
                darkMode = true;
            }
            else {
                document.body.style.backgroundColor = "white";
                document.body.style.color = "black";
                header.style.backgroundColor = "lightgray";
                darkMode = false;
            }
        }

        function showGreeting()
        {
            var time = new Date();
            var hour = time.getHours();
            var message = "";

            if (hour < 12) {
                message = "Good Morning";
            }
            else if (hour < 18) {
                message = "Good Afternoon";
            }
            else {
                message = "Good Evening";
            }

            document.getElementById("greeting").innerHTML = message;
        }
    </script>
</body>
</html>
